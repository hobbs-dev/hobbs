name: R CMD check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: windows-latest, r: "release" }
          - { os: windows-latest, r: "devel" }
          - { os: macos-latest,   r: "release" }
          - { os: ubuntu-latest,  r: "release" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_REMOTE_: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # CRAN/Rtools uses the GNU Rust target on standard 64-bit Windows.
      # GitHub's Windows Rust host is MSVC by default, so install the same
      # target selected by tools/rustarch.R and src/Makevars.ucrt.
      - name: Install Windows GNU Rust target
        if: runner.os == 'Windows'
        shell: pwsh
        run: rustup target add x86_64-pc-windows-gnu

      - name: Show Rust toolchain
        shell: bash
        run: |
          rustc --version
          rustc -vV
          cargo --version
          rustup show
          rustup target list --installed

      # Needed because --as-cran builds the PDF manual.
      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      # Extra Linux compiler/system libraries.
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            tidy

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::BH
            any::Rcpp
            any::RcppEigen
            any::StanHeaders
            any::rstan
            any::rjags
          needs: check

      - name: Show R and compiler toolchain
        shell: Rscript {0}
        run: |
          cat("\n==================================================\n")
          cat("R VERSION\n")
          cat("==================================================\n")
          print(R.version)

          cat("\nR.version.string:\n")
          print(R.version.string)

          cat("\nPlatform:\n")
          print(R.version$platform)

          cat("\nR home:\n")
          print(R.home())

          cat("\nLibrary paths:\n")
          print(.libPaths())

          cat("\n==================================================\n")
          cat("R COMPILER CONFIGURATION\n")
          cat("==================================================\n")

          cat("\nCC:\n")
          system("R CMD config CC")

          cat("\nCFLAGS:\n")
          system("R CMD config CFLAGS")

          cat("\nCPPFLAGS:\n")
          system("R CMD config CPPFLAGS")

          cat("\nCXX:\n")
          system("R CMD config CXX")

          cat("\nCXXFLAGS:\n")
          system("R CMD config CXXFLAGS")

          cat("\nCXX11:\n")
          system("R CMD config CXX11")

          cat("\nCXX14:\n")
          system("R CMD config CXX14")

          cat("\nCXX17:\n")
          system("R CMD config CXX17")

          cat("\nCXX20:\n")
          system("R CMD config CXX20")

          cat("\nLDFLAGS:\n")
          system("R CMD config LDFLAGS")

          cat("\n==================================================\n")
          cat("RUST TOOLCHAIN\n")
          cat("==================================================\n")

          cat("\nCargo:\n")
          system("cargo --version")

          cat("\nRust:\n")
          system("rustc --version")

          cat("\nRust verbose:\n")
          system("rustc -vV")

          cat("\nInstalled Rust targets:\n")
          system("rustup target list --installed")

          cat("\nRustup show:\n")
          system("rustup show")

          cat("\n==================================================\n")
          cat("ENVIRONMENT\n")
          cat("==================================================\n")

          vars <- c(
            "PATH",
            "RTOOLS40_HOME",
            "RTOOLS42_HOME",
            "RTOOLS43_HOME",
            "RTOOLS44_HOME",
            "RTOOLS45_HOME",
            "RTOOLS46_HOME",
            "CC",
            "CXX",
            "CXX11",
            "CXX14",
            "CXX17",
            "CXX20",
            "CFLAGS",
            "CXXFLAGS",
            "CPPFLAGS",
            "LDFLAGS",
            "RUSTFLAGS",
            "CARGO_BUILD_TARGET"
          )

          vals <- Sys.getenv(vars, unset = NA_character_)

          print(
            data.frame(
              variable = vars,
              value = unname(vals),
              row.names = NULL
            )
          )

      - name: Show Windows toolchain details
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=================================================="
          Write-Host "WINDOWS ENVIRONMENT"
          Write-Host "=================================================="

          Write-Host "`nWindows version:"
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsBuildNumber

          Write-Host "`nPATH:"
          Write-Host $env:PATH

          Write-Host "`nwhere.exe R:"
          where.exe R

          Write-Host "`nwhere.exe Rscript:"
          where.exe Rscript

          Write-Host "`nwhere.exe gcc:"
          where.exe gcc

          Write-Host "`nwhere.exe g++:"
          where.exe g++

          Write-Host "`nwhere.exe make:"
          where.exe make

          Write-Host "`nwhere.exe cargo:"
          where.exe cargo

          Write-Host "`nwhere.exe rustc:"
          where.exe rustc

          Write-Host "`nwhere.exe objdump:"
          where.exe objdump

          Write-Host "`nGCC version:"
          gcc --version

          Write-Host "`nG++ version:"
          g++ --version

          Write-Host "`nRust verbose:"
          rustc -vV

          Write-Host "`nRust targets:"
          rustup target list --installed

          Write-Host "`nRust target selected by tools/rustarch.R:"
          & Rscript tools/rustarch.R
          Write-Host ""

      # Build and install exactly as CRAN installs the source package. This is
      # the important architecture test: on Windows, Cargo builds libhobbs.a
      # and Rtools links launcher.c + libhobbs.a into the installed hobbs.exe.
      - name: Install HOBBS from source
        shell: Rscript {0}
        run: |
          install.packages(
            ".",
            repos = NULL,
            type = "source",
            INSTALL_opts = c("--preclean", "--no-multiarch")
          )

      # Do not call hobbs_build_sampler(rebuild = TRUE) here. That exercises
      # the user-cache Cargo rebuild path, not the CRAN install-time staticlib
      # + Rtools launcher path that this workflow is intended to validate.
      - name: Verify installed HOBBS sampler
        shell: Rscript {0}
        run: |
          library(hobbs)

          cat("\n==================================================\n")
          cat("INSTALLED SAMPLER\n")
          cat("==================================================\n")

          sampler <- hobbs_build_sampler(
            rebuild = FALSE,
            quiet = FALSE
          )

          print(sampler)
          stopifnot(file.exists(sampler))

          cat("\nSampler file info:\n")
          print(file.info(sampler))

          installed_root <- system.file("hobbs", package = "hobbs")
          cat("\nInstalled HOBBS directory:\n")
          print(installed_root)

          cat("\nInstalled bin directory:\n")
          print(list.files(
            file.path(installed_root, "bin"),
            all.files = TRUE,
            full.names = TRUE
          ))

          cat("\n==================================================\n")
          cat("hobbs_check_sampler()\n")
          cat("==================================================\n")

          sampler_ok <- hobbs_check_sampler(quiet = FALSE)
          print(sampler_ok)
          stopifnot(isTRUE(sampler_ok))

      # This is the exact operation that failed on win-builder before the
      # hellorust-style design: Windows loading and executing the installed
      # sampler. Test it explicitly before the full package check.
      - name: Directly launch installed HOBBS sampler
        shell: Rscript {0}
        run: |
          library(hobbs)

          sampler <- hobbs_build_sampler(
            rebuild = FALSE,
            quiet = FALSE
          )

          cat("\nSampler:\n")
          print(sampler)

          cat("\nAttempting direct installed sampler launch with --help\n")

          output <- tempfile()
          errors <- tempfile()

          status <- system2(
            sampler,
            args = "--help",
            stdout = output,
            stderr = errors
          )

          cat("\nExit status:\n")
          print(status)

          cat("\nSTDOUT:\n")
          if (file.exists(output)) {
            cat(readLines(output, warn = FALSE), sep = "\n")
          }

          cat("\nSTDERR:\n")
          if (file.exists(errors)) {
            cat(readLines(errors, warn = FALSE), sep = "\n")
          }

          if (!identical(status, 0L)) {
            stop(
              "Direct installed sampler launch failed with status ",
              status
            )
          }

      # On Windows, inspect the final Rtools-linked executable rather than a
      # Cargo-produced .exe. This makes loader/runtime dependencies visible in
      # the CI log if Windows ever fails before Rust reaches main().
      - name: Inspect Windows sampler executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sampler = & Rscript -e 'cat(hobbs::hobbs_build_sampler(rebuild = FALSE, quiet = TRUE))'

          if (-not (Test-Path $sampler)) {
            throw "Installed hobbs.exe was not found: $sampler"
          }

          Write-Host "=================================================="
          Write-Host "INSTALLED HOBBS.EXE"
          Write-Host "=================================================="
          Write-Host $sampler
          Get-Item $sampler | Format-List FullName, Length, LastWriteTime

          Write-Host "`nPE/import information from objdump:"
          objdump -p $sampler | Select-String -Pattern "file format|DLL Name|Subsystem|ImageBase|AddressOfEntryPoint"

      # Run a tiny real HOBBS model before the complete R CMD check so this
      # catches launcher/Rust integration problems with a short, focused log.
      - name: Run HOBBS smoke model
        shell: Rscript {0}
        run: |
          library(hobbs)

          set.seed(1)
          n <- 40L
          y <- rnorm(n, 0.5, 1)

          model <- 'param mu(1);
          block mu(1) {
            mu(1) ~ dnorm(0, 3);
            for (i = 1:n) y(i) - mu(1) ~ normal01();
          }'

          fit <- hobbs(
            model = model,
            data = list(y = y),
            samples = 20,
            burnin = 10,
            seed = 1,
            quiet = FALSE
          )

          print(fit)
          stopifnot(inherits(fit, "hobbs_run"))

      - name: R CMD check --as-cran
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
          error-on: '"error"'
          upload-snapshots: true
